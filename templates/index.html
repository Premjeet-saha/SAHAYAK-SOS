<!DOCTYPE html>
<html>
  <head>
    <title>SAHAYAK SOS Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e9ecef; color: #333; display: flex; height: 100vh; overflow: hidden; }
      #citizen-panel { width: 400px; background: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #dee2e6; z-index: 10; }
      .app-header { background: #d9534f; color: white; padding: 20px; text-align: center; position: relative; }
      .app-header h1 { margin: 0; font-size: 20px; font-weight: bold; }
      .app-header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }
      .gps-badge { position: absolute; top: 20px; right: 20px; font-size: 11px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 12px; }
      .app-body { padding: 25px; flex-grow: 1; overflow-y: auto; }
      .friendly-label { font-size: 16px; font-weight: bold; color: #495057; margin-bottom: 15px; display: block; }
      .input-options { display: flex; gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 5px; border-radius: 8px; }
      .option-btn { flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; color: #6c757d; text-align: center; transition: 0.2s; }
      .option-btn.active { color: #d9534f; background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .input-view { display: none; }
      .input-view.active { display: block; }
      textarea { width: 100%; height: 100px; border: 2px solid #ced4da; border-radius: 8px; padding: 15px; font-size: 15px; resize: none; box-sizing: border-box; margin-bottom: 20px; font-family: inherit; }
      textarea:focus { border-color: #d9534f; outline: none; }
      .mic-container { text-align: center; margin-bottom: 20px; }
      .mic-btn { width: 70px; height: 70px; border-radius: 50%; background: #f8f9fa; border: 2px solid #ced4da; font-size: 28px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.3s; }
      .mic-btn.recording { background: #fee2e2; border-color: #ef4444; color: #ef4444; animation: pulse 1.5s infinite; }
      #transcription-box { background: #f8f9fa; padding: 10px; border-radius: 6px; font-size: 14px; color: #495057; font-style: italic; min-height: 40px; display: none; margin-top: 15px; border: 1px solid #ced4da;}
      .upload-box { display: block; box-sizing: border-box; border: 2px dashed #ced4da; border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; background: #f8f9fa; transition: 0.2s; }
      .upload-box:hover { border-color: #d9534f; background: #fff5f5; }
      #image-preview { max-width: 100%; max-height: 150px; display: none; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ced4da; }
      @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
      .sos-button { width: 100%; padding: 18px; background: #d9534f; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(217, 83, 79, 0.3); }
      .sos-button:hover { background: #c9302c; }
      #center-map { flex-grow: 1; position: relative; }
      #map { height: 100%; width: 100%; z-index: 1; }
      #dispatch-panel { width: 340px; background: #1e293b; color: white; padding: 25px; z-index: 10; overflow-y: auto; border-left: 1px solid #0f172a; }
      #dispatch-panel h2 { color: #38bdf8; font-size: 16px; text-transform: uppercase; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
      .data-card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
      .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
      .val { font-weight: bold; color: #fff; }
      .alert-text { color: #ef4444; }
      .ai-box { border-left: 4px solid #a855f7; background: rgba(168, 85, 247, 0.1); padding: 15px; border-radius: 4px; font-size: 13px; line-height: 1.5; color: #e9d5ff; }
    </style>
  </head>
  <body>
    
    <div id="citizen-panel">
      <div class="app-header">
        <h1>SAHAYAK SOS</h1>
        <p>Emergency Assistance Portal</p>
        <div class="gps-badge" id="gps-status">📍 GPS Active</div>
      </div>
      <div class="app-body">
        
        <div class="input-options">
          <div class="option-btn active" onclick="switchInput('text', this)">✏️ Text</div>
          <div class="option-btn" onclick="switchInput('voice', this)">🎤 Voice</div>
          <div class="option-btn" onclick="switchInput('image', this)">📸 Photo</div>
        </div>
        
        <label class="friendly-label">What is your emergency?</label>
        
        <div id="view-text" class="input-view active">
          <textarea id="user-input" placeholder="Example: Boht zorr se aag lagi hai..."></textarea>
        </div>

        <div id="view-voice" class="input-view">
          <div class="mic-container">
            <button id="mic-btn" class="mic-btn" onclick="startRecording()">🎤</button>
            <p id="mic-status" style="font-size: 13px; color: #6c757d; margin-top: 10px;">Tap to speak (Hindi/English)</p>
            <div id="transcription-box"></div>
          </div>
        </div>

        <div id="view-image" class="input-view">
          <label class="upload-box" for="file-upload">
            <span style="font-size: 24px;">📷</span><br>
            <span style="font-size: 14px; color: #6c757d;">Tap to upload damage photo</span>
            <input type="file" id="file-upload" accept="image/*" style="display: none;" onchange="previewImage(event)">
          </label>
          <div style="text-align: center;">
            <img id="image-preview" src="" alt="Preview">
          </div>
        </div>
        
        <button class="sos-button" onclick="getLocationAndSend()">SEND HELP NOW</button>
      </div>
    </div>

    <div id="center-map"><div id="map"></div></div>

    <div id="dispatch-panel">
      <h2>Command Center</h2>
      <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 5px;">PRIORITY SCORE</span>
        <div id="ui-score" style="font-size: 36px; font-weight: bold; color: #ef4444;">--</div>
      </div>
      <div class="data-card" id="extracted-data">
        <div style="text-align: center; color: #64748b; font-size: 12px;">Waiting for citizen report...</div>
      </div>
      <h2 style="margin-top: 30px;">AI Dispatch Routing</h2>
      <div class="ai-box">
        <strong style="color: #d8b4fe; display: block; margin-bottom: 5px;">Analysis:</strong>
        <span id="ui-gemini">Monitoring for emergencies...</span>
      </div>
    </div>

    <script>
      let map, marker;
      let currentType = 'text';
      let payloadData = "";

      function switchInput(type, element) {
        currentType = type;
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        document.querySelectorAll('.input-view').forEach(view => view.classList.remove('active'));
        document.getElementById(`view-${type}`).classList.add('active');
      }

      function startRecording() {
        const btn = document.getElementById('mic-btn');
        const status = document.getElementById('mic-status');
        const box = document.getElementById('transcription-box');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Voice recognition requires Google Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;

        recognition.onstart = function() {
            btn.classList.add('recording');
            status.innerText = "Listening... (Speak now)";
            box.style.display = "none";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            btn.classList.remove('recording');
            status.innerText = "Audio captured successfully.";
            box.style.display = "block";
            payloadData = transcript; 
            box.innerText = `"${transcript}"`;
        };

        recognition.onerror = function() {
            btn.classList.remove('recording');
            status.innerText = "Microphone error. Try again.";
        };

        recognition.start();
      }

      function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('image-preview');
                img.src = e.target.result;
                img.style.display = "inline-block";
                payloadData = e.target.result; 
            }
            reader.readAsDataURL(file);
        }
      }

      function initMap() {
        map = L.map('map').setView([20.296, 85.824], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        fetchDashboard();
      }

      function getLocationAndSend() {
        if (currentType === 'text') {
            payloadData = document.getElementById("user-input").value;
        }

        const fallbackLat = 20.296 + (Math.random() - 0.5) * 0.02;
        const fallbackLng = 85.824 + (Math.random() - 0.5) * 0.02;
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendSOS(pos.coords.latitude, pos.coords.longitude, "gps"),
                () => sendSOS(fallbackLat, fallbackLng, "demo_fallback"),
                { timeout: 3000 }
            );
        } else {
            sendSOS(fallbackLat, fallbackLng, "demo_fallback");
        }
      }

      function sendSOS(lat, lng, locationSource) {
        fetch('http://127.0.0.1:5000/report-emergency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat: lat, lng: lng, raw_input: payloadData, type: currentType, location_source: locationSource })
        })
        .then(res => res.json())
        .then(() => {
          alert("Emergency report sent successfully! Services routed.");
          document.getElementById("user-input").value = "";
          document.getElementById('image-preview').style.display = "none";
          document.getElementById('transcription-box').style.display = "none";
          payloadData = "";
        })
        .catch(err => alert("Error connecting to server."));
      }

      function fetchDashboard() {
        fetch('http://127.0.0.1:5000/get-victim')
          .then(res => res.json())
          .then(data => {
            if (data.priority_score > 0) {
              const pos = [parseFloat(data.lat), parseFloat(data.lng)];
              if (!marker) {
                  marker = L.marker(pos).addTo(map);
              } else {
                  marker.setLatLng(pos);
              }
              map.setView(pos, 15);
            }

            if (data.structured_data && data.structured_data.incident_id) {
                document.getElementById("ui-score").innerText = data.priority_score;
                document.getElementById("ui-gemini").innerText = data.gemini_explanation;
                
                const sd = data.structured_data;
                document.getElementById("extracted-data").innerHTML = `
                  <div class="row"><span>Incident ID:</span> <span class="val">${sd.incident_id}</span></div>
                  <div class="row"><span>Incident Type:</span> <span class="val alert-text">${sd.type}</span></div>
                  <div class="row"><span>Hazard Level:</span> <span class="val">${sd.hazard_level}</span></div>
                  <div class="row"><span>People Count:</span> <span class="val">${sd.people_involved}</span></div>
                  <div class="row"><span>Medical Need:</span> <span class="val ${sd.medical_emergency === 'YES' ? 'alert-text' : ''}">${sd.medical_emergency}</span></div>
                  <div class="row"><span>Dispatched:</span> <span class="val" style="color: #38bdf8;">${sd.resource_needed}</span></div>
                `;
            }
            setTimeout(fetchDashboard, 1500);
          }).catch(() => setTimeout(fetchDashboard, 3000));
      }

      window.onload = initMap;
    </script>
  </body>
</html>
